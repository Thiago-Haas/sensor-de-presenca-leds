services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
  nodered:
    build: .
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node-data:/data
      - ./flows.json:/data/flows.json:ro
    environment:
      - FLOWS=flows.json
    depends_on:
      - mosquitto
    restart: unless-stopped
volumes:
  mqtt-data:
  node-data:
